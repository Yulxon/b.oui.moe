    <div class="prose about-body"><p>你好呀，欢迎来到我的互联网小角落！</p>
<p>我是 <strong>Chumi</strong>，也可以叫我花野、彼方，或者 Yulxon。</p>

<p><strong>Ი𐑼</strong> 是我的互联网小屋，收留技术笔记、阅读随想和一些尚未长大的念头。不保证正确，也不急着完成。</p>
<p>如果你恰好路过，欢迎进来坐坐。说不定，我们会在某个不起眼的问题里相遇呢。</p>
