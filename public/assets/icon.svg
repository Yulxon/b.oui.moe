<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="fv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dbcc6"/>
      <stop offset="1" stop-color="#9d96c9"/>
    </linearGradient>
    <linearGradient id="fv-moon" gradientUnits="userSpaceOnUse" x1="20" y1="10" x2="40" y2="58">
      <stop offset="0"   stop-color="#fff"/>
      <stop offset=".3"  stop-color="#fff"/>
      <stop offset=".5"  stop-color="#F5A9B8"/>
      <stop offset=".7"  stop-color="#fff"/>
      <stop offset="1"   stop-color="#fff"/>
    </linearGradient>
    <mask id="fv-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="41" cy="27" r="20" fill="#000"/>
    </mask>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#fv-bg)"/>

  <!-- 月牙 -->
  <circle cx="30" cy="34" r="24" fill="url(#fv-moon)" mask="url(#fv-cut)"/>

  <!-- 星 -->
  <path fill="#fff"
        d="M42 20Q43.6 28.4 52 30Q43.6 31.6 42 40Q40.4 31.6 32 30Q40.4 28.4 42 20Z"/>

  <!-- 星尘：鼠尾草绿、珊瑚、粉，来自网站色板 -->
  <circle cx="53" cy="17" r="1.4" fill="#F5A9B8"/>
  <circle cx="47" cy="10" r="1"   fill="#fff"/>
  <circle cx="54" cy="50" r="1.2" fill="#b5caa0"/>
</svg>
